---
apiVersion: apps/v1
kind: Deployment
metadata:
  # CBC kaneo mailer
  #
  # GEFLITST and CBC share the kaneo-mailer image; each is its own inbox
  # (IMAP mailbox + KANEO_API_KEY), so nothing collides at the Kaneo side.
  #
  # Preconditions before this starts working:
  # 1. IMAP folders IN, OUT and REJECTED under IMAP_ROOT must exist (the
  #    mailer does not create them). Add a server-side filter that moves mail
  #    from trusted senders only into IN.
  # 2. Kaneo: sign in as the service user, create an API key under
  #    Settings -> API keys. Set it as KANEO_API_KEY in the sealed secret.
  name: kaneo-mailer-cbc
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: kaneo-mailer-cbc
  template:
    metadata:
      labels:
        io.kompose.service: kaneo-mailer-cbc
    spec:
      containers:
        - name: kaneo-mailer-cbc
          image: ghcr.io/gewis/kaneo-mailer:1.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: IMAP_PORT
              value: '993'
            - name: IMAP_TLS
              value: 'true'
            - name: IMAP_ROOT
              value: Shared/cbc@gewis.nl/INBOX/Kaneo-Import
            - name: KANEO_URL
              value: https://kaneo.gewis.nl/api
            - name: POLL_INTERVAL
              value: '300'
            - name: LOG_LEVEL
              value: info
            - name: TZ
              value: Europe/Amsterdam
          envFrom:
            - secretRef:
                name: kaneo-mailer-cbc-secrets
      dnsConfig:
        options:
          - name: ndots
            value: '1'
