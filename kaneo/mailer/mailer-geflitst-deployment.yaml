---
apiVersion: apps/v1
kind: Deployment
metadata:
  # GEFLITST kaneo mailer
  #
  # Turns email into Kaneo tasks: polls IMAP, creates a task per message in the
  # project/column named by the X-Kaneo-Project-Id / X-Kaneo-Column headers.
  #
  # Preconditions before this starts working:
  # 1. IMAP folders IN, OUT and REJECTED under IMAP_ROOT must exist (the
  #    mailer does not create them). Add a server-side filter that moves mail
  #    from trusted senders only into IN.
  # 2. Kaneo: sign in as the service user, create an API key under
  #    Settings -> API keys. Set it as KANEO_API_KEY in the sealed secret.
  #
  # One mailer per inbox: to add more, duplicate this Deployment (and the
  # Secret) with a new name, own IMAP mailbox, and own KANEO_API_KEY.
  name: kaneo-mailer-geflitst
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: kaneo-mailer-geflitst
  template:
    metadata:
      labels:
        io.kompose.service: kaneo-mailer-geflitst
    spec:
      containers:
        - name: kaneo-mailer-geflitst
          image: ghcr.io/gewis/kaneo-mailer:v1.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: IMAP_PORT
              value: '993'
            - name: IMAP_TLS
              value: 'true'
            - name: IMAP_ROOT
              value: API
            - name: KANEO_URL
              value: https://kaneo.gewis.nl/api
            - name: POLL_INTERVAL
              value: '300'
            - name: LOG_LEVEL
              value: info
            - name: TZ
              value: Europe/Amsterdam
          envFrom:
            - secretRef:
                name: kaneo-mailer-geflitst-secrets
      dnsConfig:
        options:
          - name: ndots
            value: '1'
