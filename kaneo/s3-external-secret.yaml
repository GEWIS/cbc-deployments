apiVersion: v1
kind: ServiceAccount
metadata:
  name: seaweedfs
  namespace: kaneo-prod
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: seaweedfs
  namespace: kaneo-prod
spec:
  provider:
    vault:
      server: http://openbao-active.openbao.svc:8200
      path: seaweedfs
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: seaweedfs-kaneo-prod
          serviceAccountRef:
            name: seaweedfs
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kaneo-s3
  namespace: kaneo-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: seaweedfs
    kind: SecretStore
  target:
    name: kaneo-s3
  data:
    - secretKey: S3_ENDPOINT
      remoteRef:
        key: kaneo-prod/kaneo
        property: endpoint
    - secretKey: S3_BUCKET
      remoteRef:
        key: kaneo-prod/kaneo
        property: bucket
    - secretKey: S3_REGION
      remoteRef:
        key: kaneo-prod/kaneo
        property: region
    - secretKey: S3_ACCESS_KEY_ID
      remoteRef:
        key: kaneo-prod/kaneo
        property: access_key_id
    - secretKey: S3_SECRET_ACCESS_KEY
      remoteRef:
        key: kaneo-prod/kaneo
        property: secret_access_key
