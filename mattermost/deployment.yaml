apiVersion: apps/v1
kind: Deployment
metadata:
  name: mattermost
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: mattermost
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: mattermost
    spec:
      # Team Edition has no SSO; the mattermost-oidc plugin adds Keycloak login. On every start
      # Mattermost wipes its local plugin dirs and reinstalls the bundles from plugins/ in the
      # file store (S3), so placing the pinned bundle there is all it takes to install or upgrade it.
      # The OIDC plugin only discovers Keycloak when it activates and never retries, so Mattermost
      # must not start while Keycloak is unreachable.
      # The channel-auto-join plugin (source in channel-auto-join/) adds every team member to new
      # public channels. Upstream has no such feature, so it is built here, but only when the stored
      # bundle was built from other source or another Go toolchain.
      # The System Console stores an uploaded brand image as brand/image.png in the file store and
      # Mattermost serves that file as-is, so writing it there on every start pins it to git.
      initContainers:
        - name: plugin-cache
          image: curlimages/curl:8.22.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -euc
            - |
              curl -fs --aws-sigv4 "aws:amz:$MM_FILESETTINGS_AMAZONS3REGION:s3" \
                --user "$MM_FILESETTINGS_AMAZONS3ACCESSKEYID:$MM_FILESETTINGS_AMAZONS3SECRETACCESSKEY" \
                -o /plugins/stored.tar.gz \
                "https://$MM_FILESETTINGS_AMAZONS3ENDPOINT/$MM_FILESETTINGS_AMAZONS3BUCKET/plugins/channel-auto-join.tar.gz" ||
                echo "==> no stored channel-auto-join bundle"
          envFrom:
            - secretRef:
                name: mattermost-s3
          env:
            # Must match MM_FILESETTINGS_AMAZONS3ENDPOINT below.
            - name: MM_FILESETTINGS_AMAZONS3ENDPOINT
              value: s3.gewis.nl
          volumeMounts:
            - mountPath: /plugins
              name: plugins
        # Writes /plugins/channel-auto-join.tar.gz only when the stored bundle is outdated. The
        # bundle records a hash of the source and `go version`; go.sum pins the dependencies.
        - name: channel-auto-join
          image: golang:1.27.2-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
          command:
            - sh
            - -euc
            - |
              # Go ignores a go.mod directly in the temp root, so build in a subdirectory.
              mkdir /tmp/src && cp -L /src/* /tmp/src && cd /tmp/src
              hash=$({ go version; cat go.mod go.sum main.go plugin.json; } | sha256sum | cut -d ' ' -f 1)
              stored=$(tar -xzOf /plugins/stored.tar.gz channel-auto-join/source.sha256 2>/dev/null || true)
              if [ "$stored" = "$hash" ]; then
                echo "==> stored channel-auto-join bundle is up to date"
                exit 0
              fi
              bundle=/tmp/bundle/channel-auto-join
              mkdir -p "$bundle/server"
              CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o "$bundle/server/plugin" .
              cp plugin.json "$bundle/"
              echo "$hash" > "$bundle/source.sha256"
              tar -czf /plugins/channel-auto-join.tar.gz -C /tmp/bundle channel-auto-join
          env:
            - name: GOTOOLCHAIN
              value: local
            - name: GOCACHE
              value: /tmp/go-cache
            - name: GOPATH
              value: /tmp/go
          volumeMounts:
            - mountPath: /src
              name: channel-auto-join
            - mountPath: /plugins
              name: plugins
        - name: file-store
          image: curlimages/curl:8.22.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -euc
            - |
              s3() {
                key=$1
                shift
                curl -fs --aws-sigv4 "aws:amz:$MM_FILESETTINGS_AMAZONS3REGION:s3" \
                  --user "$MM_FILESETTINGS_AMAZONS3ACCESSKEYID:$MM_FILESETTINGS_AMAZONS3SECRETACCESSKEY" \
                  "$@" "https://$MM_FILESETTINGS_AMAZONS3ENDPOINT/$MM_FILESETTINGS_AMAZONS3BUCKET/$key"
              }
              bundle=/tmp/mattermost-oidc.tar.gz
              if ! { s3 plugins/mattermost-oidc.tar.gz -o "$bundle" && echo "$PLUGIN_SHA256  $bundle" | sha256sum -c -s; }; then
                curl -fsSL -o "$bundle" "$PLUGIN_URL"
                echo "$PLUGIN_SHA256  $bundle" | sha256sum -c -
                s3 plugins/mattermost-oidc.tar.gz -S -T "$bundle"
              fi
              s3 brand/image.png -S -T /theming/brand-image.png
              if [ -f /plugins/channel-auto-join.tar.gz ]; then
                s3 plugins/channel-auto-join.tar.gz -S -T /plugins/channel-auto-join.tar.gz
              fi
              until curl -fsS -o /dev/null "$OIDC_ISSUER/.well-known/openid-configuration"; do
                echo "==> waiting for $OIDC_ISSUER"
                sleep 5
              done
          envFrom:
            - secretRef:
                name: mattermost-s3
          env:
            - name: PLUGIN_URL
              value: https://github.com/server-camp/mattermost-oidc-plugin/releases/download/v0.6.1/mattermost-oidc-0.6.1.tar.gz
            - name: PLUGIN_SHA256
              value: 7e5b83cb9d6fcfd8ec3e8230b25c6b1be29f810ac1b3157b7641b7c2d64808c1
            # Must match IssuerURL in MM_PLUGINSETTINGS_PLUGINS below.
            - name: OIDC_ISSUER
              value: https://auth.gewis.nl/realms/GEWISWG
            # Must match MM_FILESETTINGS_AMAZONS3ENDPOINT below.
            - name: MM_FILESETTINGS_AMAZONS3ENDPOINT
              value: s3.gewis.nl
          volumeMounts:
            - mountPath: /theming
              name: theming
            - mountPath: /plugins
              name: plugins
      containers:
        - name: mattermost
          image: mattermost/mattermost-team-edition:11.11.1
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: mattermost-secrets
            - secretRef:
                name: mattermost-s3
            - secretRef:
                name: mattermost-db
          env:
            - name: TZ
              value: Europe/Amsterdam
            # Keep the config in the database, so no config volume is needed.
            - name: MM_CONFIG
              value: $(MM_SQLSETTINGS_DATASOURCE)
            - name: MM_SQLSETTINGS_DRIVERNAME
              value: postgres
            # The admin container uses local mode, the unauthenticated API on this socket.
            - name: MM_SERVICESETTINGS_ENABLELOCALMODE
              value: 'true'
            - name: MM_SERVICESETTINGS_LOCALMODESOCKETLOCATION
              value: /local/mattermost.socket
            - name: MM_SERVICESETTINGS_SITEURL
              value: https://mattermost.gewis.nl
            - name: MM_SERVICESETTINGS_TRUSTEDPROXYIPHEADER
              value: X-Forwarded-For X-Real-IP
            - name: MM_FILESETTINGS_DRIVERNAME
              value: amazons3
            - name: MM_FILESETTINGS_AMAZONS3ENDPOINT
              value: s3.gewis.nl
            - name: MM_FILESETTINGS_AMAZONS3SSL
              value: 'true'
            - name: MM_LOGSETTINGS_ENABLEFILE
              value: 'false'
            - name: MM_LOGSETTINGS_ENABLEDIAGNOSTICS
              value: 'false'
            - name: MM_EMAILSETTINGS_SENDEMAILNOTIFICATIONS
              value: 'true'
            - name: MM_EMAILSETTINGS_SMTPSERVER
              value: smtp.gewis.nl
            - name: MM_EMAILSETTINGS_SMTPPORT
              value: '587'
            - name: MM_EMAILSETTINGS_CONNECTIONSECURITY
              value: STARTTLS
            - name: MM_EMAILSETTINGS_ENABLESMTPAUTH
              value: 'true'
            - name: MM_EMAILSETTINGS_FEEDBACKEMAIL
              value: mattermost@gewis.nl
            - name: MM_EMAILSETTINGS_FEEDBACKNAME
              value: GEWIS Mattermost
            - name: MM_EMAILSETTINGS_ENABLESIGNUPWITHEMAIL
              value: 'false'
            - name: MM_EMAILSETTINGS_ENABLESIGNINWITHEMAIL
              value: 'false'
            # Only local accounts have a password.
            - name: MM_EMAILSETTINGS_ENABLESIGNINWITHUSERNAME
              value: 'true'
            - name: MM_TEAMSETTINGS_ENABLEUSERCREATION
              value: 'false'
            - name: MM_SERVICESETTINGS_ENABLEEMAILINVITATIONS
              value: 'false'
            - name: MM_PASSWORDSETTINGS_ENABLEFORGOTLINK
              value: 'false'
            - name: MM_TEAMSETTINGS_SITENAME
              value: GEWIS Mattermost
            - name: MM_TEAMSETTINGS_CUSTOMDESCRIPTIONTEXT
              value: The GEWIS Mattermost deployment
            # The image itself is uploaded by the file-store init container.
            - name: MM_TEAMSETTINGS_ENABLECUSTOMBRAND
              value: 'true'
            - name: MM_TEAMSETTINGS_CUSTOMBRANDTEXT
              value: Wie dit leest trekt een bak!
            - name: MM_SUPPORTSETTINGS_ENABLEASKCOMMUNITYLINK
              value: 'false'
            - name: MM_SUPPORTSETTINGS_ALLOWDOWNLOADLOGS
              value: 'false'
            - name: MM_LOCALIZATIONSETTINGS_AVAILABLELOCALES
              value: en
            - name: MM_TEAMSETTINGS_RESTRICTDIRECTMESSAGE
              value: team
            - name: MM_TEAMSETTINGS_TEAMMATENAMEDISPLAY
              value: full_name
            - name: MM_AIRECAPSETTINGS_ENABLE
              value: 'false'
            - name: MM_ANNOUNCEMENTSETTINGS_USERNOTICESENABLED
              value: 'false'
            # Replaces all plugin states: Playbooks needs a Professional licence, Calls needs
            # UDP 8443 exposed and AI needs an LLM backend.
            - name: MM_PLUGINSETTINGS_PLUGINSTATES
              value: >-
                {"mattermost-oidc": {"Enable": true}, "channel-auto-join": {"Enable": true},
                "playbooks": {"Enable": false}, "com.mattermost.calls": {"Enable": false},
                "mattermost-ai": {"Enable": false}, "com.mattermost.nps": {"Enable": false}}
            # Replaces all plugin settings; unset keys fall back to Go zero values, not plugin defaults.
            - name: MM_PLUGINSETTINGS_PLUGINS
              value: >-
                {"mattermost-oidc": {"Enable": true,
                "IssuerURL": "https://auth.gewis.nl/realms/GEWISWG",
                "ClientID": "mattermost-prod", "ClientSecret": "$(OIDC_CLIENT_SECRET)",
                "Scopes": "openid profile email", "ButtonText": "Log in with GEWIS",
                "ButtonColor": "#0058CC", "UsernameClaim": "preferred_username",
                "EmailClaim": "email", "FirstNameClaim": "given_name",
                "LastNameClaim": "family_name", "PositionClaim": "",
                "EmailVerifiedClaim": "email_verified", "RequireEmailVerified": false,
                "AutoCreateAccounts": true, "AutoLinkByEmail": false, "DefaultTeam": ""}}
          ports:
            - containerPort: 8065
              name: main
              protocol: TCP
          # The first start runs all database migrations.
          startupProbe:
            httpGet:
              path: /api/v4/system/ping
              port: main
            failureThreshold: 60
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/v4/system/ping
              port: main
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v4/system/ping
              port: main
            failureThreshold: 5
            periodSeconds: 30
            timeoutSeconds: 10
          volumeMounts:
            - mountPath: /local
              name: local
        # Mattermost has no admin bootstrap setting, so this creates the local cbclocal system
        # admin with the password from the secret once, and restores its roles on every start.
        - name: admin
          image: curlimages/curl:8.22.0
          imagePullPolicy: IfNotPresent
          # The socket is only accessible to the mattermost user.
          securityContext:
            runAsUser: 2000
            runAsGroup: 2000
          command:
            - sh
            - -euc
            - |
              api() {
                curl -s --unix-socket /local/mattermost.socket "$@"
              }
              url=http://localhost/api/v4
              until status=$(api -o /tmp/user.json -w '%{http_code}' "$url/users/username/cbclocal"); do
                echo "==> waiting for Mattermost"
                sleep 5
              done
              case $status in
                200) ;;
                404)
                  password=$(printf '%s' "$ADMIN_PASSWORD" | sed 's/[\\"]/\\&/g')
                  api -fS -o /tmp/user.json \
                    -d "{\"username\": \"cbclocal\", \"email\": \"cbc@gewis.nl\", \"password\": \"$password\"}" \
                    "$url/users"
                  ;;
                *)
                  echo "==> looking up cbclocal failed with HTTP $status: $(cat /tmp/user.json)"
                  exit 1
                  ;;
              esac
              id=$(grep -o '"id":"[a-z0-9]*"' /tmp/user.json | head -n 1 | cut -d '"' -f 4)
              api -fS -o /dev/null -X PUT -d '{"roles": "system_admin system_user"}' "$url/users/$id/roles"
              echo "==> cbclocal ($id) is a system admin"
              trap 'exit 0' TERM
              while :; do
                sleep 3600 &
                wait $!
              done
          env:
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mattermost-secrets
                  key: ADMIN_PASSWORD
          volumeMounts:
            - mountPath: /local
              name: local
      dnsConfig:
        options:
          - name: ndots
            value: '1'
      volumes:
        - name: theming
          configMap:
            name: mattermost-theming
        - name: channel-auto-join
          configMap:
            name: mattermost-channel-auto-join
        - name: local
          emptyDir: {}
        - name: plugins
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mobile-bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: mobile-bridge
  template:
    metadata:
      labels:
        io.kompose.service: mobile-bridge
    spec:
      # The native mobile app only offers SSO when the client config advertises core OpenID,
      # and always starts it at /oauth/openid/mobile_login. This shim from the mattermost-oidc
      # plugin fakes the former for mobile clients and redirects the latter into the plugin.
      # Upstream publishes no image, so the pinned source (Go standard library only) is
      # built at startup.
      initContainers:
        - name: build
          image: golang:1.26.3-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
          command:
            - sh
            - -euc
            - |
              # Go ignores a go.mod directly in the temp root, so build in a subdirectory.
              mkdir /tmp/src && cd /tmp/src
              for f in go.mod main.go; do wget -q "$SOURCE/$f"; done
              printf '%s  go.mod\n%s  main.go\n' "$GO_MOD_SHA256" "$MAIN_GO_SHA256" | sha256sum -c -
              CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o /bridge/mobile-bridge .
          env:
            # Commit of plugin release v0.6.1; keep in sync with PLUGIN_URL above.
            - name: SOURCE
              value: https://raw.githubusercontent.com/server-camp/mattermost-oidc-plugin/049611fdd27e5a1a9bcd5af6b89defa495c6ecd3/mobile-bridge
            - name: GO_MOD_SHA256
              value: d750ddf3d74987e5f13bfcc5b72fb5216e1e836d3920f23e866e7d82ede4a9bb
            - name: MAIN_GO_SHA256
              value: 7264e5a7f02193fa009f03c13973948df6f70233057b26a1f7d8d4deae0924af
            - name: GOTOOLCHAIN
              value: local
            - name: GOCACHE
              value: /tmp/go-cache
            - name: GOPATH
              value: /tmp/go
          volumeMounts:
            - mountPath: /bridge
              name: bridge
      containers:
        - name: mobile-bridge
          image: gcr.io/distroless/static-debian12:nonroot
          imagePullPolicy: IfNotPresent
          command:
            - /bridge/mobile-bridge
          env:
            - name: UPSTREAM
              value: http://mattermost:8065
          ports:
            - containerPort: 8066
              name: main
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: main
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: main
            periodSeconds: 30
          volumeMounts:
            - mountPath: /bridge
              name: bridge
      dnsConfig:
        options:
          - name: ndots
            value: '1'
      volumes:
        - name: bridge
          emptyDir: {}
