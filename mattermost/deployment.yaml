apiVersion: apps/v1
kind: Deployment
metadata:
  name: mattermost
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: mattermost
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: mattermost
    spec:
      # Team Edition has no SSO; the mattermost-oidc plugin adds Keycloak login. On every start
      # Mattermost wipes its local plugin dirs and reinstalls the bundles from plugins/ in the
      # file store (S3), so placing the pinned bundle there is all it takes to install or upgrade it.
      # The plugin only discovers Keycloak when it activates and never retries, so Mattermost
      # must not start while Keycloak is unreachable.
      # The System Console stores an uploaded brand image as brand/image.png in the file store and
      # Mattermost serves that file as-is, so writing it there on every start pins it to git.
      initContainers:
        - name: file-store
          image: curlimages/curl:8.22.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -euc
            - |
              s3() {
                key=$1
                shift
                curl -fs --aws-sigv4 "aws:amz:$MM_FILESETTINGS_AMAZONS3REGION:s3" \
                  --user "$MM_FILESETTINGS_AMAZONS3ACCESSKEYID:$MM_FILESETTINGS_AMAZONS3SECRETACCESSKEY" \
                  "$@" "https://$MM_FILESETTINGS_AMAZONS3ENDPOINT/$MM_FILESETTINGS_AMAZONS3BUCKET/$key"
              }
              bundle=/tmp/mattermost-oidc.tar.gz
              if ! { s3 plugins/mattermost-oidc.tar.gz -o "$bundle" && echo "$PLUGIN_SHA256  $bundle" | sha256sum -c -s; }; then
                curl -fsSL -o "$bundle" "$PLUGIN_URL"
                echo "$PLUGIN_SHA256  $bundle" | sha256sum -c -
                s3 plugins/mattermost-oidc.tar.gz -S -T "$bundle"
              fi
              s3 brand/image.png -S -T /theming/brand-image.png
              until curl -fsS -o /dev/null "$OIDC_ISSUER/.well-known/openid-configuration"; do
                echo "==> waiting for $OIDC_ISSUER"
                sleep 5
              done
          envFrom:
            - secretRef:
                name: mattermost-s3
          env:
            - name: PLUGIN_URL
              value: https://github.com/server-camp/mattermost-oidc-plugin/releases/download/v0.6.1/mattermost-oidc-0.6.1.tar.gz
            - name: PLUGIN_SHA256
              value: 7e5b83cb9d6fcfd8ec3e8230b25c6b1be29f810ac1b3157b7641b7c2d64808c1
            # Must match IssuerURL in MM_PLUGINSETTINGS_PLUGINS below.
            - name: OIDC_ISSUER
              value: https://auth.gewis.nl/realms/GEWISWG
            # Must match MM_FILESETTINGS_AMAZONS3ENDPOINT below.
            - name: MM_FILESETTINGS_AMAZONS3ENDPOINT
              value: s3.gewis.nl
          volumeMounts:
            - mountPath: /theming
              name: theming
      containers:
        - name: mattermost
          image: mattermost/mattermost-team-edition:11.11.1
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: mattermost-secrets
            - secretRef:
                name: mattermost-s3
            - secretRef:
                name: mattermost-db
          env:
            - name: TZ
              value: Europe/Amsterdam
            # Keep the config in the database, so no config volume is needed.
            - name: MM_CONFIG
              value: $(MM_SQLSETTINGS_DATASOURCE)
            - name: MM_SQLSETTINGS_DRIVERNAME
              value: postgres
            - name: MM_SERVICESETTINGS_SITEURL
              value: https://mattermost.gewis.nl
            - name: MM_SERVICESETTINGS_TRUSTEDPROXYIPHEADER
              value: X-Forwarded-For X-Real-IP
            - name: MM_FILESETTINGS_DRIVERNAME
              value: amazons3
            - name: MM_FILESETTINGS_AMAZONS3ENDPOINT
              value: s3.gewis.nl
            - name: MM_FILESETTINGS_AMAZONS3SSL
              value: 'true'
            - name: MM_LOGSETTINGS_ENABLEFILE
              value: 'false'
            - name: MM_LOGSETTINGS_ENABLEDIAGNOSTICS
              value: 'false'
            - name: MM_EMAILSETTINGS_SENDEMAILNOTIFICATIONS
              value: 'true'
            - name: MM_EMAILSETTINGS_SMTPSERVER
              value: smtp.gewis.nl
            - name: MM_EMAILSETTINGS_SMTPPORT
              value: '587'
            - name: MM_EMAILSETTINGS_CONNECTIONSECURITY
              value: STARTTLS
            - name: MM_EMAILSETTINGS_ENABLESMTPAUTH
              value: 'true'
            - name: MM_EMAILSETTINGS_FEEDBACKEMAIL
              value: svc-mattermost-prod@gewis.nl
            - name: MM_EMAILSETTINGS_FEEDBACKNAME
              value: GEWIS Mattermost
            - name: MM_EMAILSETTINGS_ENABLESIGNUPWITHEMAIL
              value: 'false'
            - name: MM_EMAILSETTINGS_ENABLESIGNINWITHEMAIL
              value: 'false'
            # Only local accounts have a password.
            - name: MM_EMAILSETTINGS_ENABLESIGNINWITHUSERNAME
              value: 'true'
            - name: MM_TEAMSETTINGS_ENABLEUSERCREATION
              value: 'false'
            - name: MM_SERVICESETTINGS_ENABLEEMAILINVITATIONS
              value: 'false'
            - name: MM_PASSWORDSETTINGS_ENABLEFORGOTLINK
              value: 'false'
            - name: MM_TEAMSETTINGS_SITENAME
              value: GEWIS Mattermost
            - name: MM_TEAMSETTINGS_CUSTOMDESCRIPTIONTEXT
              value: The GEWIS Mattermost deployment
            # The image itself is uploaded by the file-store init container.
            - name: MM_TEAMSETTINGS_ENABLECUSTOMBRAND
              value: 'true'
            - name: MM_TEAMSETTINGS_CUSTOMBRANDTEXT
              value: Wie dit leest trekt een bak!
            - name: MM_SUPPORTSETTINGS_ENABLEASKCOMMUNITYLINK
              value: 'false'
            - name: MM_SUPPORTSETTINGS_ALLOWDOWNLOADLOGS
              value: 'false'
            - name: MM_LOCALIZATIONSETTINGS_AVAILABLELOCALES
              value: en
            - name: MM_TEAMSETTINGS_RESTRICTDIRECTMESSAGE
              value: team
            - name: MM_TEAMSETTINGS_TEAMMATENAMEDISPLAY
              value: full_name
            - name: MM_AIRECAPSETTINGS_ENABLE
              value: 'false'
            - name: MM_ANNOUNCEMENTSETTINGS_USERNOTICESENABLED
              value: 'false'
            # Replaces all plugin states: Playbooks needs a Professional licence, Calls needs
            # UDP 8443 exposed and AI needs an LLM backend.
            - name: MM_PLUGINSETTINGS_PLUGINSTATES
              value: >-
                {"mattermost-oidc": {"Enable": true}, "playbooks": {"Enable": false},
                "com.mattermost.calls": {"Enable": false}, "mattermost-ai": {"Enable": false},
                "com.mattermost.nps": {"Enable": false}}
            # Replaces all plugin settings; unset keys fall back to Go zero values, not plugin defaults.
            - name: MM_PLUGINSETTINGS_PLUGINS
              value: >-
                {"mattermost-oidc": {"Enable": true,
                "IssuerURL": "https://auth.gewis.nl/realms/GEWISWG",
                "ClientID": "mattermost-prod", "ClientSecret": "$(OIDC_CLIENT_SECRET)",
                "Scopes": "openid profile email", "ButtonText": "Log in with GEWIS",
                "ButtonColor": "#0058CC", "UsernameClaim": "preferred_username",
                "EmailClaim": "email", "FirstNameClaim": "given_name",
                "LastNameClaim": "family_name", "PositionClaim": "",
                "EmailVerifiedClaim": "email_verified", "RequireEmailVerified": false,
                "AutoCreateAccounts": true, "AutoLinkByEmail": false, "DefaultTeam": ""}}
          ports:
            - containerPort: 8065
              name: main
              protocol: TCP
          # The first start runs all database migrations.
          startupProbe:
            httpGet:
              path: /api/v4/system/ping
              port: main
            failureThreshold: 60
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/v4/system/ping
              port: main
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v4/system/ping
              port: main
            failureThreshold: 5
            periodSeconds: 30
            timeoutSeconds: 10
      dnsConfig:
        options:
          - name: ndots
            value: '1'
      volumes:
        - name: theming
          configMap:
            name: mattermost-theming
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mobile-bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: mobile-bridge
  template:
    metadata:
      labels:
        io.kompose.service: mobile-bridge
    spec:
      # The native mobile app only offers SSO when the client config advertises core OpenID,
      # and always starts it at /oauth/openid/mobile_login. This shim from the mattermost-oidc
      # plugin fakes the former for mobile clients and redirects the latter into the plugin.
      # Upstream publishes no image, so the pinned source (Go standard library only) is
      # built at startup.
      initContainers:
        - name: build
          image: golang:1.26.3-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
          command:
            - sh
            - -euc
            - |
              # Go ignores a go.mod directly in the temp root, so build in a subdirectory.
              mkdir /tmp/src && cd /tmp/src
              for f in go.mod main.go; do wget -q "$SOURCE/$f"; done
              printf '%s  go.mod\n%s  main.go\n' "$GO_MOD_SHA256" "$MAIN_GO_SHA256" | sha256sum -c -
              CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o /bridge/mobile-bridge .
          env:
            # Commit of plugin release v0.6.1; keep in sync with PLUGIN_URL above.
            - name: SOURCE
              value: https://raw.githubusercontent.com/server-camp/mattermost-oidc-plugin/049611fdd27e5a1a9bcd5af6b89defa495c6ecd3/mobile-bridge
            - name: GO_MOD_SHA256
              value: d750ddf3d74987e5f13bfcc5b72fb5216e1e836d3920f23e866e7d82ede4a9bb
            - name: MAIN_GO_SHA256
              value: 7264e5a7f02193fa009f03c13973948df6f70233057b26a1f7d8d4deae0924af
            - name: GOTOOLCHAIN
              value: local
            - name: GOCACHE
              value: /tmp/go-cache
            - name: GOPATH
              value: /tmp/go
          volumeMounts:
            - mountPath: /bridge
              name: bridge
      containers:
        - name: mobile-bridge
          image: gcr.io/distroless/static-debian12:nonroot
          imagePullPolicy: IfNotPresent
          command:
            - /bridge/mobile-bridge
          env:
            - name: UPSTREAM
              value: http://mattermost:8065
          ports:
            - containerPort: 8066
              name: main
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: main
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: main
            periodSeconds: 30
          volumeMounts:
            - mountPath: /bridge
              name: bridge
      dnsConfig:
        options:
          - name: ndots
            value: '1'
      volumes:
        - name: bridge
          emptyDir: {}
