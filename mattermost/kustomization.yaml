apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - secrets.yaml
  - s3-external-secret.yaml
  - postgres-external-secret.yaml

configMapGenerator:
  - name: mattermost-theming
    files:
      - brand-image.png=theming/GEWIS Logo.png
  - name: mattermost-channel-auto-join
    files:
      - channel-auto-join/go.mod
      - channel-auto-join/go.sum
      - channel-auto-join/main.go
      - channel-auto-join/plugin.json
