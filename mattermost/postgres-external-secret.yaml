apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres
  namespace: mattermost-prod
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: postgres
  namespace: mattermost-prod
spec:
  provider:
    vault:
      server: http://openbao-active.openbao.svc:8200
      path: postgres
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: postgres-mattermost-prod
          serviceAccountRef:
            name: postgres
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mattermost-db
  namespace: mattermost-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: postgres
    kind: SecretStore
  target:
    name: mattermost-db
    # Mattermost only takes a URL DSN. The server has a Let's Encrypt certificate, so
    # verify-full works against the system CAs.
    template:
      data:
        MM_SQLSETTINGS_DATASOURCE: >-
          postgres://{{ .username | urlquery }}:{{ .password | urlquery }}@postgres.net.gewis.nl:5432/{{ .dbname | urlquery }}?sslmode=verify-full&connect_timeout=10
  data:
    - secretKey: dbname
      remoteRef:
        key: mattermost-prod/mattermost
        property: dbname
    - secretKey: username
      remoteRef:
        key: mattermost-prod/mattermost
        property: username
    - secretKey: password
      remoteRef:
        key: mattermost-prod/mattermost
        property: password
