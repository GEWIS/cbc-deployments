apiVersion: v1
kind: ServiceAccount
metadata:
  name: seaweedfs
  namespace: mattermost-prod
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: seaweedfs
  namespace: mattermost-prod
spec:
  provider:
    vault:
      server: http://openbao-active.openbao.svc:8200
      path: seaweedfs
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: seaweedfs-mattermost-prod
          serviceAccountRef:
            name: seaweedfs
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mattermost-s3
  namespace: mattermost-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: seaweedfs
    kind: SecretStore
  target:
    name: mattermost-s3
  data:
    - secretKey: MM_FILESETTINGS_AMAZONS3BUCKET
      remoteRef:
        key: mattermost-prod/mattermost
        property: bucket
    - secretKey: MM_FILESETTINGS_AMAZONS3REGION
      remoteRef:
        key: mattermost-prod/mattermost
        property: region
    - secretKey: MM_FILESETTINGS_AMAZONS3ACCESSKEYID
      remoteRef:
        key: mattermost-prod/mattermost
        property: access_key_id
    - secretKey: MM_FILESETTINGS_AMAZONS3SECRETACCESSKEY
      remoteRef:
        key: mattermost-prod/mattermost
        property: secret_access_key
