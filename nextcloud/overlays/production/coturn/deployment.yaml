apiVersion: apps/v1
kind: Deployment
metadata:
  name: coturn
spec:
  # Allocations live in this one process and the relay ports are fixed; never run two.
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: coturn
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: coturn
    spec:
      containers:
        - name: coturn
          image: coturn/coturn:4.18.0
          imagePullPolicy: IfNotPresent
          # TURN for Nextcloud Talk; Talk hands out time-limited credentials derived from
          # TURN_SECRET (TURN REST API), configured by hooks/10-configure.sh.
          # external-ip must be the LoadBalancer IP, which is what the TURN_SERVER host
          # resolves to. The relay range must match the ports in service.yaml.
          # The config file keeps the secret out of the process list.
          command:
            - sh
            - -euc
            - |
              host=${TURN_SERVER%:*}
              port=${TURN_SERVER##*:}
              set -- $(getent ahostsv4 "$host")
              [ $# -gt 0 ] || { echo "==> cannot resolve $host" >&2; exit 1; }
              cat > /tmp/turnserver.conf <<EOF
              listening-port=$port
              min-port=49160
              max-port=49259
              external-ip=$1
              realm=$host
              use-auth-secret
              static-auth-secret=$TURN_SECRET
              fingerprint
              no-tls
              no-tcp-relay
              no-multicast-peers
              no-software-attribute
              log-file=stdout
              simple-log
              pidfile=/tmp/turnserver.pid
              denied-peer-ip=0.0.0.0-0.255.255.255
              denied-peer-ip=10.0.0.0-10.255.255.255
              denied-peer-ip=100.64.0.0-100.127.255.255
              denied-peer-ip=127.0.0.0-127.255.255.255
              denied-peer-ip=169.254.0.0-169.254.255.255
              denied-peer-ip=172.16.0.0-172.31.255.255
              denied-peer-ip=192.168.0.0-192.168.255.255
              denied-peer-ip=::1
              denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
              denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
              EOF
              exec turnserver -c /tmp/turnserver.conf
          env:
            - name: TURN_SERVER
              valueFrom:
                configMapKeyRef:
                  name: nextcloud-env-config
                  key: TURN_SERVER
            - name: TURN_SECRET
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secrets
                  key: TURN_SECRET
          ports:
            - containerPort: 3478
              name: turn-udp
              protocol: UDP
            - containerPort: 3478
              name: turn-tcp
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: turn-tcp
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: turn-tcp
            failureThreshold: 4
            periodSeconds: 10
