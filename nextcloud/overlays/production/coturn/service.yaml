apiVersion: v1
kind: Service
metadata:
  name: coturn
spec:
  # Public IP that TURN_SERVER's host must resolve to.
  type: LoadBalancer
  # No SNAT: coturn must see real client addresses for allocations and permissions.
  externalTrafficPolicy: Local
  selector:
    io.kompose.service: coturn
  ports:
    - {name: turn-udp, port: 3478, protocol: UDP}
    - {name: turn-tcp, port: 3478, protocol: TCP}
    # Relay range; must match min-port/max-port in deployment.yaml.
