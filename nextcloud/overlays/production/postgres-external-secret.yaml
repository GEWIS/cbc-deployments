apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres
  namespace: nextcloud-prod
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: postgres
  namespace: nextcloud-prod
spec:
  provider:
    vault:
      server: http://openbao-active.openbao.svc:8200
      path: postgres
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: postgres-nextcloud-prod
          serviceAccountRef:
            name: postgres
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-db
  namespace: nextcloud-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: postgres
    kind: SecretStore
  target:
    name: nextcloud-db
  data:
    - secretKey: POSTGRES_DB
      remoteRef:
        key: nextcloud-prod/nextcloud
        property: dbname
    - secretKey: POSTGRES_USER
      remoteRef:
        key: nextcloud-prod/nextcloud
        property: username
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: nextcloud-prod/nextcloud
        property: password