apiVersion: v1
kind: ServiceAccount
metadata:
  name: seaweedfs
  namespace: nextcloud-prod
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: seaweedfs
  namespace: nextcloud-prod
spec:
  provider:
    vault:
      server: http://openbao-active.openbao.svc:8200
      path: seaweedfs
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: seaweedfs-nextcloud-prod
          serviceAccountRef:
            name: seaweedfs
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-s3
  namespace: nextcloud-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: seaweedfs
    kind: SecretStore
  target:
    name: nextcloud-s3
  data:
    - secretKey: OBJECTSTORE_S3_BUCKET
      remoteRef:
        key: nextcloud-prod/nextcloud
        property: bucket
    - secretKey: OBJECTSTORE_S3_REGION
      remoteRef:
        key: nextcloud-prod/nextcloud
        property: region
    - secretKey: OBJECTSTORE_S3_KEY
      remoteRef:
        key: nextcloud-prod/nextcloud
        property: access_key_id
    - secretKey: OBJECTSTORE_S3_SECRET
      remoteRef:
        key: nextcloud-prod/nextcloud
        property: secret_access_key
