apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nextcloud
  namespace: nextcloud-prod
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`cloud.gewis.nl`)
      kind: Rule
      services:
        - name: nextcloud
          port: 80
    - match: Host(`cloud.gewis.nl`) && (PathPrefix(`/browser`) || PathPrefix(`/hosting/discovery`) || PathPrefix(`/hosting/capabilities`) || PathPrefix(`/cool`))
      kind: Rule
      services:
        - name: collabora
          port: 9980
